[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-config-bridge"
version = "0.1.0"
description = "Share one canonical skills, plugins, and hooks catalog across Codex and Claude Code surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ReS0421" }]
keywords = ["codex", "claude-code", "agent-skills", "plugins", "hooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
agentbridge = "agent_config_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/ReS0421/agent-config-bridge"
Issues = "https://github.com/ReS0421/agent-config-bridge/issues"
Repository = "https://github.com/ReS0421/agent-config-bridge"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_config_bridge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agent_config_bridge"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
