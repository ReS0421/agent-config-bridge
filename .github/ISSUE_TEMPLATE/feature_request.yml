name: Feature request
description: Propose a portable sharing or safety improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which product, platform, component, or workflow is currently blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired outcome and any compatibility or safety tradeoffs.
    validations:
      required: true
