name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Check release contract
        run: uv run python scripts/check_release_contract.py

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=agent_config_bridge --cov-report=term-missing

      - name: Exercise Windows Task Scheduler round trip
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        env:
          AGENTBRIDGE_RUN_WINDOWS_SCHEDULER_INTEGRATION: "1"
        run: uv run pytest -q tests/test_windows_task_scheduler_integration.py

      - name: Build distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv build

      - name: Validate distribution metadata
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uvx --from twine==6.2.0 twine check dist/*

      - name: Smoke test wheel entrypoint
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          uv venv --python 3.12 "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/agentbridge" --help
